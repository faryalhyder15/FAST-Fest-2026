<!DOCTYPE html>
<html lang="en">
<head>
    <title>FAST Fest 2026 - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: linear-gradient(to bottom right, #0f2027, #203a43, #2c5364);">

    <nav class="navbar">
        <div class="logo">FAST Fest 2026</div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="events.html">Events</a></li>
            <li><a href="register.html">Register</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

<main class="container">
    <h1>Contact Us</h1>
    <!-- Contact Form Card -->
    <div class="contact-form-card">
        <form>
            <div class="form-group">
                <label for="cname">Your Name</label>
                <input type="text" id="cname" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="cemail">Email Address</label>
                <input type="email" id="cemail" placeholder="yourname@nu.edu.pk" required>
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" placeholder="e.g. Question about Gaming Tournament" required>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" placeholder="Write your message here..." required></textarea>
            </div>

            <button type="submit" class="btn">Send Message</button>
        </form>
    </div>
</main>

<!--footer-->

    <footer>
        <p>FAST-NU Faisalabad Chiniot Campus • 2026</p>
    </footer>

</body>
</html>
