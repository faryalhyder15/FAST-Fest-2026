<!DOCTYPE html>
<html lang="en">
<head>
    <title>FAST Fest 2026 - Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body style="background: linear-gradient(to bottom right, #0f2027, #203a43, #2c5364);">

    <nav class="navbar">
        <div class="logo">FAST Fest 2026</div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="events.html">Events</a></li>
            <li><a href="register.html" class="active">Register</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <div class="container">
        <main>
            <h1>Register Now</h1>
            <div class="form-card register-card">
                <form class="register-form">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="Enter your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="yourname@nu.edu.pk" required>
                    </div>

                    <div class="form-group">
                        <label for="contact">Contact Number</label>
                        <input type="tel" id="contact" placeholder="+92 300 1234567" required>
                    </div>

                    <div class="form-group">
                        <label for="event">Select Event</label>
                        <select id="event" required>
                            <option value="" disabled selected>Choose one event</option>
                            <option value="coding">Coding Competition</option>
                            <option value="gaming">Gaming Tournament</option>
                            <option value="singing">Singing Competition</option>
                        </select>
                    </div>

                    <button type="submit" class="btn">Submit Registration</button>
                </form>
            </div>
        </main>
    </div>

    <footer>
        <p>FAST-NU Faisalabad Chiniot Campus • 2026</p>
    </footer>

</body>
</html>
